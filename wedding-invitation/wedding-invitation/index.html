<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhavena &amp; Siddharth — Wedding Invitation</title>
<meta name="description" content="Join us as Bhavena Urs and Siddharth Urs celebrate their wedding on 21–22 November 2026 in Mysore.">
<meta name="theme-color" content="#F7F0E1">

<!-- Open Graph (link previews). These must stay as plain text; they are not read from data.js.
     Optional: after publishing, add <meta property="og:image" content="https://YOUR-LIVE-LINK/assets/images/preview.jpg"> -->
<meta property="og:type" content="website">
<meta property="og:title" content="Bhavena &amp; Siddharth — Wedding Invitation">
<meta property="og:description" content="Join us as Bhavena Urs and Siddharth Urs celebrate their wedding on 21–22 November 2026 in Mysore.">
<meta name="twitter:card" content="summary">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<!-- Free web fonts. If offline, elegant system fonts are used instead. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<!-- Shared icons and floral art (drawn once, reused) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.4 18.7L4 20z"/></symbol>

    <path id="leaf" d="M0 0C5-7 15-7 22 0C15 7 5 7 0 0Z"/>
    <g id="flower">
      <g style="fill:var(--burgundy)" opacity=".9">
        <ellipse cx="0" cy="-6.5" rx="3.8" ry="6.5"/>
        <ellipse cx="0" cy="-6.5" rx="3.8" ry="6.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6.5" rx="3.8" ry="6.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6.5" rx="3.8" ry="6.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6.5" rx="3.8" ry="6.5" transform="rotate(288)"/>
      </g>
      <circle r="2.6" style="fill:var(--gold-light)"/>
    </g>
    <g id="corner-art">
      <path d="M4 4C30 8 58 26 66 58S78 100 112 112" fill="none" style="stroke:var(--gold)" stroke-width="1.1"/>
      <path d="M4 4C6 38 18 64 48 78" fill="none" style="stroke:var(--gold)" stroke-width=".9"/>
      <g style="fill:var(--sage)">
        <use href="#leaf" transform="translate(23.5 9.6) rotate(60) scale(.9)"/>
        <use href="#leaf" transform="translate(41.7 20.5) rotate(-20)"/>
        <use href="#leaf" transform="translate(41.7 20.5) rotate(85) scale(.8)"/>
        <use href="#leaf" transform="translate(56.6 36.6) rotate(-45) scale(.95)"/>
        <use href="#leaf" transform="translate(56.6 36.6) rotate(110) scale(.8)"/>
        <use href="#leaf" transform="translate(66 58) rotate(-60) scale(.9)"/>
        <use href="#leaf" transform="translate(71.7 78.3) rotate(20) scale(.9)"/>
        <use href="#leaf" transform="translate(79.2 92.5) rotate(-50) scale(.8)"/>
        <use href="#leaf" transform="translate(91.6 103) rotate(15) scale(.8)"/>
        <use href="#leaf" transform="translate(7.5 28) rotate(-10) scale(.8)"/>
        <use href="#leaf" transform="translate(15.5 48.5) rotate(-25) scale(.85)"/>
        <use href="#leaf" transform="translate(28.7 65.4) rotate(-40) scale(.8)"/>
      </g>
      <use href="#flower" transform="translate(34 34) scale(1.1)"/>
      <use href="#flower" transform="translate(66 58) scale(.65)"/>
      <use href="#flower" transform="translate(98 108) scale(.6)"/>
      <use href="#flower" transform="translate(11 66) scale(.55)"/>
    </g>
  </defs>
</svg>

<main>

<!-- ============ 1. HERO / INVITATION ============ -->
<section class="hero" aria-label="Wedding invitation">
  <div class="plate">
    <svg class="corner corner--tl" viewBox="0 0 120 120" aria-hidden="true"><use href="#corner-art"/></svg>
    <svg class="corner corner--tr" viewBox="0 0 120 120" aria-hidden="true"><use href="#corner-art"/></svg>
    <svg class="corner corner--bl" viewBox="0 0 120 120" aria-hidden="true"><use href="#corner-art"/></svg>
    <svg class="corner corner--br" viewBox="0 0 120 120" aria-hidden="true"><use href="#corner-art"/></svg>

    <div class="invite">
      <p class="seq invocation" style="--i:0" data-text="invocation"></p>
      <p class="seq blessing" style="--i:1" data-text="blessingIntro"></p>
      <p class="seq family" style="--i:2" data-text="familyText"></p>
      <p class="seq request" style="--i:3" data-text="requestText"></p>

      <h1 class="couple">
        <span class="seq person person--bride" style="--i:4">
          <span class="name" data-text="bride"></span>
          <span class="nick">(<span data-text="brideNickname"></span>)</span>
        </span>
        <span class="seq weds" style="--i:5" data-text="wedsWord"></span>
        <span class="seq person person--groom" style="--i:6">
          <span class="name" data-text="groom"></span>
          <span class="nick">(<span data-text="groomNickname"></span>)</span>
        </span>
      </h1>

      <p class="seq invite-line" style="--i:7" data-text="inviteLine"></p>
      <div class="seq rule" style="--i:8" aria-hidden="true"><span class="diamond"></span></div>
      <p class="seq date" style="--i:8" data-text="dateRange"></p>

      <a class="seq btn" style="--i:9" href="#events">Explore Invitation <span class="bob" aria-hidden="true">↓</span></a>
    </div>
  </div>
</section>

<!-- ============ 2. EVENTS ============ -->
<section class="section" id="events" aria-labelledby="events-title">
  <div class="wrap">
    <h2 class="section__title reveal" id="events-title">Events</h2>
    <div class="rule reveal" aria-hidden="true"><span class="diamond"></span></div>

    <div class="events">

      <article class="event event--reception reveal" id="ev-reception">
        <h3 class="event__name" data-text="receptionTitle"></h3>
        <p class="event__date" data-text="dateReception"></p>
        <p class="event__day" data-text="receptionDay"></p>
        <p class="event__time" data-text="receptionTime"></p>
        <p class="event__sub" data-text="receptionSubtitle"></p>
        <div class="event__actions">
          <a class="btn btn--ghost" data-maps target="_blank" rel="noopener">
            <svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> Get Directions</a>
          <button class="btn btn--ghost cal-toggle" type="button" aria-expanded="false" aria-controls="cal-reception">
            <svg class="icon" aria-hidden="true"><use href="#i-cal"/></svg> Add to Calendar</button>
          <div class="cal-menu" id="cal-reception" hidden>
            <a class="btn btn--sm btn--ghost" data-gcal="reception" target="_blank" rel="noopener">Add to Google Calendar</a>
            <button class="btn btn--sm btn--ghost" type="button" data-ics="reception">Download Calendar File</button>
          </div>
        </div>
      </article>

      <article class="event event--wedding on-dark reveal" id="ev-wedding">
        <h3 class="event__name" data-text="weddingTitle"></h3>
        <p class="event__date" data-text="dateWedding"></p>
        <p class="event__day" data-text="weddingDay"></p>
        <p class="event__time" data-text="weddingTime"></p>
        <p class="event__sub" data-text="weddingSubtitle"></p>
        <div class="event__actions">
          <a class="btn btn--light" data-maps target="_blank" rel="noopener">
            <svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> Get Directions</a>
          <button class="btn btn--ghost-light cal-toggle" type="button" aria-expanded="false" aria-controls="cal-wedding">
            <svg class="icon" aria-hidden="true"><use href="#i-cal"/></svg> Add to Calendar</button>
          <div class="cal-menu" id="cal-wedding" hidden>
            <a class="btn btn--sm btn--ghost-light" data-gcal="wedding" target="_blank" rel="noopener">Add to Google Calendar</a>
            <button class="btn btn--sm btn--ghost-light" type="button" data-ics="wedding">Download Calendar File</button>
          </div>
        </div>
      </article>

    </div>
  </div>
</section>

<!-- ============ 3. COUNTDOWN ============ -->
<section class="section countdown" id="countdown" aria-labelledby="cd-title">
  <div class="wrap">
    <h2 class="section__title reveal" id="cd-title">Countdown to the wedding</h2>
    <div class="rule reveal" aria-hidden="true"><span class="diamond"></span></div>

    <div class="cd reveal" id="cd" role="timer">
      <div class="cd__unit"><span class="cd__num" id="cd-days">--</span><span class="cd__label">Days</span></div>
      <div class="cd__unit"><span class="cd__num" id="cd-hours">--</span><span class="cd__label">Hours</span></div>
      <div class="cd__unit"><span class="cd__num" id="cd-minutes">--</span><span class="cd__label">Minutes</span></div>
      <div class="cd__unit"><span class="cd__num" id="cd-seconds">--</span><span class="cd__label">Seconds</span></div>
    </div>
    <p class="cd-done" id="cd-done" hidden>Today is the day ♥</p>
  </div>
</section>

<!-- ============ 4. VENUE ============ -->
<section class="section" id="venue" aria-labelledby="venue-title">
  <div class="wrap">
    <h2 class="section__title reveal" id="venue-title">Venue</h2>
    <div class="rule reveal" aria-hidden="true"><span class="diamond"></span></div>

    <div class="venue">
      <!-- Stylised location panel (decorative, no map API needed) -->
      <a class="map reveal" data-maps target="_blank" rel="noopener" aria-label="Open the venue in Google Maps">
        <svg class="map__bg" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="400" height="320" fill="#E6EBDC"/>
          <path d="M-10 250C80 210 150 270 240 230S380 190 420 210" fill="none" stroke="#C7D6D0" stroke-width="20" stroke-linecap="round"/>
          <ellipse cx="78" cy="78" rx="60" ry="42" fill="#CFDAC2"/>
          <ellipse cx="335" cy="96" rx="44" ry="30" fill="#D5DFC8"/>
          <g fill="#F3EDDD">
            <rect x="120" y="20" width="62" height="42" rx="3"/><rect x="232" y="28" width="48" height="60" rx="3"/>
            <rect x="20" y="170" width="70" height="46" rx="3"/><rect x="118" y="170" width="60" height="44" rx="3"/>
            <rect x="240" y="150" width="56" height="50" rx="3"/><rect x="330" y="148" width="54" height="46" rx="3"/>
            <rect x="130" y="268" width="70" height="40" rx="3"/><rect x="300" y="256" width="66" height="44" rx="3"/>
          </g>
          <g fill="none" stroke="#FBF7EA" stroke-linecap="round">
            <path d="M-10 142L410 128" stroke-width="12"/><path d="M200 -10L214 330" stroke-width="12"/>
            <path d="M-10 60L410 34" stroke-width="6"/><path d="M104 -10L88 330" stroke-width="6"/>
            <path d="M304 -10L322 330" stroke-width="6"/><path d="M-10 296L410 304" stroke-width="6"/>
          </g>
          <path d="M0 80H400M0 160H400M0 240H400M100 0V320M200 0V320M300 0V320" stroke="#B08D4A" stroke-opacity=".2" stroke-width=".7"/>
        </svg>
        <span class="map__pulse" aria-hidden="true"></span>
        <svg class="map__pin" viewBox="0 0 44 56" aria-hidden="true">
          <path d="M22 54S3 36 3 21a19 19 0 0 1 38 0c0 15-19 33-19 33z" style="fill:var(--burgundy)" stroke="#D9BE84" stroke-width="1.5"/>
          <circle cx="22" cy="21" r="7" fill="#F7F0E1"/>
        </svg>
        <span class="map__label"><strong data-text="venueName"></strong><em data-text="venueCity"></em></span>
        <span class="btn map__cta"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> Open in Google Maps</span>
      </a>

      <div class="venue-card reveal">
        <span class="venue-card__icon" aria-hidden="true"><svg class="icon"><use href="#i-pin"/></svg></span>
        <h3 class="venue-card__name" data-text="venueName"></h3>
        <address class="venue-card__addr" data-address></address>
        <div class="venue-card__actions">
          <a class="btn" data-maps target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> Open in Google Maps</a>
          <a class="btn btn--ghost" data-maps target="_blank" rel="noopener">Get Directions</a>
          <button class="btn btn--ghost" type="button" id="copy-address"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg> Copy Address</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ 5. CLOSING ============ -->
<section class="section closing" id="closing" aria-label="Closing">
  <div class="wrap">
    <div class="plate plate--closing">
      <svg class="corner corner--tl" viewBox="0 0 120 120" aria-hidden="true"><use href="#corner-art"/></svg>
      <svg class="corner corner--tr" viewBox="0 0 120 120" aria-hidden="true"><use href="#corner-art"/></svg>
      <svg class="corner corner--bl" viewBox="0 0 120 120" aria-hidden="true"><use href="#corner-art"/></svg>
      <svg class="corner corner--br" viewBox="0 0 120 120" aria-hidden="true"><use href="#corner-art"/></svg>

      <div class="invite reveal">
        <!-- Photos appear here only if you add them in data.js -->
        <div class="photos" id="photos" hidden></div>

        <p class="regards" data-text="footerRegards"></p>
        <p class="footer-names" id="footer-names"></p>
        <div class="rule" aria-hidden="true"><span class="diamond"></span></div>
        <p class="thanks" data-text="footerClosing"></p>

        <div class="share">
          <button class="btn" type="button" id="share-btn" hidden><svg class="icon" aria-hidden="true"><use href="#i-share"/></svg> Share Invitation</button>
          <button class="btn" type="button" id="copy-link-btn" hidden><svg class="icon" aria-hidden="true"><use href="#i-link"/></svg> Copy Invitation Link</button>
          <a class="btn btn--ghost" id="wa-btn" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg> Share on WhatsApp</a>
        </div>
      </div>
    </div>
  </div>
</section>

</main>

<!-- Floating quick action (appears after the invitation, hides at the Venue section) -->
<a class="fab" id="fab" data-maps target="_blank" rel="noopener" tabindex="-1" aria-label="Get directions to the venue">
  <svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg> Directions
</a>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- MUSIC (optional, off by default)
     To add music later, put your own audio file in assets/ (for example assets/music.mp3)
     and add a play/pause button that calls audio.play() on tap. Never autoplay.
     <audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>
-->

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
